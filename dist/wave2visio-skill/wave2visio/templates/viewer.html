<script>
@@RENDERER_JS@@

@@SAMPLE_COMMENT@@
const SAMPLE_SPI = @@SAMPLE_JSON@@;

function render() {
  const input = document.getElementById('json-input').value.trim();
  if (!input) { alert('请输入 WaveJSON'); return; }
  let parsed;
  try { parsed = JSON.parse(input); }
  catch (e) { alert('JSON 解析错误：' + e.message); return; }

  const target = document.getElementById('diagram');
  try {
    target.innerHTML = renderWaveJson(parsed);
    currentSvg = target.innerHTML;
  } catch (e) { alert('渲染错误：' + e.message); }
}

function loadSample() {
  document.getElementById('json-input').value = JSON.stringify(SAMPLE_SPI, null, 2);
  render();
}

function downloadJson() {
  const input = document.getElementById('json-input').value;
  if (!input) { alert('没有内容'); return; }
  const blob = new Blob([input], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'waveform.json';
  a.click();
}

let currentSvg = null;

function downloadSvg() {
  if (!currentSvg) { alert('请先渲染'); return; }
  const blob = new Blob([currentSvg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'waveform.svg';
  a.click();
}
</script>
